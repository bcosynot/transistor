# Home Assistant entities for transistor.
#
# Paste this under the top-level `mqtt:` key in /config/configuration.yaml.
# If that key already exists, merge the `sensor:`/`binary_sensor:` lists into it
# rather than adding a second `mqtt:` — duplicate top-level keys are a YAML error.
#
# Apply it with the narrow reload, no core restart needed:
#     POST /api/services/mqtt/reload
# (`mqtt.reload` exists; it is not obvious from the integration page.)
#
# NOTE: YAML-configured MQTT entities have NO `object_id` option. Adding one is
# rejected with "'object_id' is an invalid option for 'sensor'" and takes the
# whole platform down. The entity id comes from `name`, so
# "Dashboard Transit" -> sensor.dashboard_transit.
#
# One entity carries the whole board as attributes; the card renders it.

mqtt:
  sensor:
    - name: "Dashboard Transit"
      unique_id: transistor_board
      state_topic: "transistor/state"
      value_template: "{{ value_json.summary }}"
      json_attributes_topic: "transistor/state"
      availability_topic: "transistor/status"
      payload_available: "online"
      payload_not_available: "offline"
      icon: mdi:bus-clock
      # The payload is a small document (a few hundred bytes) republished every
      # 15 s. Keeping it out of the recorder avoids filling the DB with
      # near-identical rows on a RAM-tight box.
      expire_after: 120

  # A separate binary sensor makes "the feed went stale" a first-class trigger
  # for automations, instead of something a template has to dig out.
  binary_sensor:
    - name: "Dashboard Transit Stale"
      unique_id: transistor_stale
      state_topic: "transistor/state"
      # A binary_sensor compares against payload_on/payload_off (ON/OFF), not
      # Python truthiness: rendering `False` directly leaves the entity 'unknown'.
      value_template: "{{ 'ON' if value_json.stale else 'OFF' }}"
      availability_topic: "transistor/status"
      payload_available: "online"
      payload_not_available: "offline"
      device_class: problem
      icon: mdi:alert-circle-outline
