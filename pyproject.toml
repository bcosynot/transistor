[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transistor"
version = "0.1.0"
description = "Publish next-departure times for NYC subway and bus lines to MQTT for a Home Assistant kiosk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "gtfs-realtime-bindings>=1.0.0",
  "paho-mqtt>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
transistor = "transistor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
